<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');

  :root {
    --bg: #04070f;
    --surface: #080d1a;
    --surface2: #0d1225;
    --surface3: #111830;
    --accent: #3b82f6;
    --accent2: #1d4ed8;
    --border: #182040;
    --text: #e8eaf6;
    --muted: #6b7a99;
    --danger: #ef4444;
    --transport: #0ea5e9;
    --snacks: #f59e0b;
    --food: #22c55e;
    --specials: #f472b6;
    --others: #a78bfa;
    --heading-bg: #070b18;
    --total-row-bg: #0a0f20;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
  }

  .app-header {
    background: linear-gradient(135deg, #070b18 0%, #0a1020 100%);
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .app-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 0.5px; margin-bottom: 14px; }
  .app-title span { color: var(--accent); }

  .input-section { display: flex; flex-direction: column; gap: 10px; }
  .date-row { display: flex; align-items: center; gap: 8px; }
  .date-label { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .date-wrapper { position: relative; flex: 1; }

  input[type="date"] {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 14px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    color-scheme: dark;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) brightness(2);
    cursor: pointer;
    width: 20px;
    height: 20px;
  }

  input[type="date"]:focus { border-color: var(--accent); }

  .expense-row { display: flex; gap: 8px; align-items: stretch; }

  .expense-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .expense-input::placeholder { color: var(--muted); }
  .expense-input:focus { border-color: var(--accent); }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-add:active { background: var(--accent2); }

  .main-content { padding: 16px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    width: 100%;
    max-width: 420px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: #fff; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  .cat-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .cat-item-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--text); }

  .cat-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .cat-btn {
    padding: 10px 6px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--surface3);
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .cat-btn.sel-Transport { border-color: var(--transport); color: var(--transport); background: rgba(14,165,233,0.1); }
  .cat-btn.sel-Snacks    { border-color: var(--snacks);    color: var(--snacks);    background: rgba(245,158,11,0.1); }
  .cat-btn.sel-Food      { border-color: var(--food);      color: var(--food);      background: rgba(34,197,94,0.1); }
  .cat-btn.sel-Specials  { border-color: var(--specials);  color: var(--specials);  background: rgba(244,114,182,0.1); }
  .cat-btn.sel-Others    { border-color: var(--others);    color: var(--others);    background: rgba(167,139,250,0.1); }

  .modal-confirm {
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    width: 100%;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  /* PDF BAR */
  .pdf-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }

  .pdf-select {
    flex: 1;
    min-width: 140px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .btn-pdf {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* MONTH TABLES */
  .month-block { margin-bottom: 28px; }

  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #070b18, #0a1020);
    border: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    padding: 13px 16px;
  }

  .month-name { font-size: 17px; font-weight: 800; color: #fff; }
  .month-total { font-size: 17px; font-weight: 800; color: var(--accent); }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
  }

  table { width: 100%; border-collapse: collapse; min-width: 760px; }

  thead tr.row-cat th {
    background: var(--heading-bg);
    padding: 10px 8px 4px;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    border-bottom: none;
    white-space: nowrap;
    border-right: 1px solid var(--border);
  }

  thead tr.row-sub th {
    background: var(--heading-bg);
    padding: 4px 8px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    border-bottom: 2px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }

  th.th-date   { text-align: left; vertical-align: middle; border-right: 1px solid var(--border); }
  th.th-total-h { text-align: right; vertical-align: middle; color: #fff; border-right: 1px solid var(--border); }
  th.th-del-h  { width: 10px; vertical-align: middle; }

  th.th-transport { color: var(--transport); }
  th.th-snacks    { color: var(--snacks); }
  th.th-food      { color: var(--food); }
  th.th-specials  { color: var(--specials); }
  th.th-others    { color: var(--others); }

  td {
    padding: 9px 8px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    vertical-align: top;
    color: var(--text);
  }

  td:last-child { border-right: none; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

  td.td-date { font-weight: 700; font-size: 13px; color: var(--muted); white-space: nowrap; vertical-align: middle; }
  td.td-name { color: var(--text); font-weight: 500; min-width: 65px; }
  td.td-price { color: var(--accent); font-weight: 700; text-align: right; white-space: nowrap; min-width: 50px; }
  td.td-empty { color: var(--muted); text-align: center; vertical-align: middle; }
  td.td-total { font-weight: 800; text-align: right; color: #fff; white-space: nowrap; vertical-align: middle; }

  tr.totals-row td {
    background: var(--total-row-bg) !important;
    border-top: 2px solid var(--border);
    font-weight: 800;
    font-size: 13px;
    text-align: center;
    color: #fff;
    vertical-align: middle;
  }

  tr.totals-row td.tot-label { color: var(--muted); font-size: 11px; letter-spacing: 0.5px; }
  tr.totals-row td.tot-grand { text-align: right; color: var(--accent); font-size: 14px; }

  .item-lines { display: flex; flex-direction: column; gap: 4px; }

  .item-line { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 1.4; }
  .price-line { font-size: 13px; line-height: 1.4; text-align: right; }

  .btn-del {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    padding: 0 2px;
    opacity: 0.6;
    line-height: 1;
    flex-shrink: 0;
  }

  .btn-del:active { opacity: 1; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #22c55e;
    color: #fff;
    padding: 10px 22px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">💸 Expense <span>Tracker</span></div>
  <div class="input-section">
    <div class="date-row">
      <span class="date-label">Date:</span>
      <div class="date-wrapper">
        <input type="date" id="dateInput"/>
      </div>
    </div>
    <div class="expense-row">
      <input class="expense-input" id="expenseInput" type="text" placeholder="pasta 50, shirt 200, lunch 70"/>
      <button class="btn-add" onclick="handleAdd()">ADD</button>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="pdf-bar">
    <select class="pdf-select" id="pdfMonthSelect">
      <option value="all">All Months</option>
    </select>
    <button class="btn-pdf" onclick="exportPDF()">Export PDF</button>
  </div>
</div>

<div class="main-content" id="mainContent">
  <div class="empty-state">No expenses yet. Add your first entry above!</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Categorise Items</h2>
    <p>These are new items. Assign a category to each:</p>
    <div id="modalItems"></div>
    <button class="modal-confirm" onclick="confirmCategories()">Confirm & Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const CATEGORIES = ["Transport", "Snacks/Orders", "Food", "Specials", "Others"];
const CAT_KEY = { "Transport":"Transport", "Snacks/Orders":"Snacks", "Food":"Food", "Specials":"Specials", "Others":"Others" };
let pendingData = null;

function todayInputVal() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}
function inputValToDisplay(val) {
  const [y,m,d] = val.split("-");
  return `${d}/${m}/${y}`;
}

document.getElementById("dateInput").value = todayInputVal();

async function handleAdd() {
  const dateVal = document.getElementById("dateInput").value;
  const raw = document.getElementById("expenseInput").value.trim();
  if (!dateVal || !raw) { showToast("Please fill in date and expenses", "#ef4444"); return; }

  const parts = raw.split(",").map(p => p.trim()).filter(Boolean);
  const itemNames = [];
  for (const part of parts) {
    const tokens = part.trim().split(" ");
    const name = tokens.slice(0, tokens.length - 1).join(" ").trim();
    if (name) itemNames.push(name);
  }

  const res = await fetch("/api/check_items", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ items: itemNames })
  });
  const { unknown, known } = await res.json();

  pendingData = { date: inputValToDisplay(dateVal), input: raw, item_categories: { ...known } };

  if (unknown.length > 0) showModal(unknown);
  else await submitEntry();
}

function showModal(unknownItems) {
  const container = document.getElementById("modalItems");
  container.innerHTML = "";
  unknownItems.forEach(item => {
    const div = document.createElement("div");
    div.className = "cat-item";
    div.dataset.item = item;
    div.innerHTML = `<div class="cat-item-name">${item}</div>
      <div class="cat-buttons">
        ${CATEGORIES.map(c => `<button class="cat-btn" data-cat="${c}" onclick="selectCat(this,'${item}')">${c}</button>`).join("")}
      </div>`;
    container.appendChild(div);
  });
  document.getElementById("modalOverlay").classList.add("active");
}

function selectCat(btn, item) {
  btn.closest(".cat-item").querySelectorAll(".cat-btn").forEach(b => b.className = "cat-btn");
  const cat = btn.dataset.cat;
  btn.className = `cat-btn sel-${CAT_KEY[cat]}`;
  pendingData.item_categories[item] = cat;
}

async function confirmCategories() {
  const items = document.querySelectorAll("#modalItems .cat-item");
  for (const item of items) {
    if (!pendingData.item_categories[item.dataset.item]) {
      showToast("Please categorise all items", "#ef4444"); return;
    }
  }
  document.getElementById("modalOverlay").classList.remove("active");
  await submitEntry();
}

async function submitEntry() {
  await fetch("/api/add_entry", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify(pendingData)
  });
  document.getElementById("expenseInput").value = "";
  pendingData = null;
  showToast("Entry saved!");
  renderAll();
}

async function deleteItem(date, id) {
  await fetch("/api/delete_item", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ date, id })
  });
  showToast("Deleted", "#ef4444");
  renderAll();
}

function fmt(n) { return n % 1 === 0 ? n : n.toFixed(2); }

async function renderAll() {
  const data = await (await fetch("/api/data")).json();
  const expenses = data.expenses || {};
  const container = document.getElementById("mainContent");

  if (Object.keys(expenses).length === 0) {
    container.innerHTML = `<div class="empty-state">No expenses yet. Add your first entry above!</div>`;
    return;
  }

  const byMonth = {};
  for (const [date, items] of Object.entries(expenses)) {
    const [d, m, y] = date.split("/");
    const mk = `${y}-${m}`;
    if (!byMonth[mk]) byMonth[mk] = {};
    byMonth[mk][date] = items;
  }

  const sortedMonths = Object.keys(byMonth).sort((a,b) => b.localeCompare(a));
  const monthNames = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

  let html = "";

  for (const mk of sortedMonths) {
    const [y, m] = mk.split("-");
    const mName = `${monthNames[parseInt(m)]} ${y}`;
    const daysData = byMonth[mk];

    const sortedDates = Object.keys(daysData).sort((a,b) => {
      const [da,ma,ya] = a.split("/"); const [db,mb,yb] = b.split("/");
      return new Date(`${ya}-${ma}-${da}`) - new Date(`${yb}-${mb}-${db}`);
    });

    let monthTotal = 0;
    const catTotals = { "Transport":0, "Snacks/Orders":0, "Food":0, "Specials":0, "Others":0 };
    for (const date of sortedDates)
      for (const item of daysData[date]) {
        monthTotal += item.amount;
        const cat = CATEGORIES.includes(item.category) ? item.category : "Others";
        catTotals[cat] += item.amount;
      }

    html += `<div class="month-block">
      <div class="month-header">
        <span class="month-name">📅 ${mName}</span>
        <span class="month-total">₹${fmt(monthTotal)}</span>
      </div>
      <div class="table-wrap"><table>
        <thead>
          <tr class="row-cat">
            <th class="th-date" rowspan="2">Date</th>
            <th class="th-transport" colspan="2">Transport</th>
            <th class="th-snacks"    colspan="2">Snacks/Orders</th>
            <th class="th-food"      colspan="2">Food</th>
            <th class="th-specials"  colspan="2">Specials</th>
            <th class="th-others"    colspan="2">Others</th>
            <th class="th-total-h"   rowspan="2">Total</th>
            <th class="th-del-h"     rowspan="2"></th>
          </tr>
          <tr class="row-sub">
            <th>Item</th><th>Price</th>
            <th>Item</th><th>Price</th>
            <th>Item</th><th>Price</th>
            <th>Item</th><th>Price</th>
            <th>Item</th><th>Price</th>
          </tr>
        </thead>
        <tbody>`;

    for (const date of sortedDates) {
      const items = daysData[date];
      const catMap = { "Transport":[], "Snacks/Orders":[], "Food":[], "Specials":[], "Others":[] };
      for (const item of items) {
        const cat = CATEGORIES.includes(item.category) ? item.category : "Others";
        catMap[cat].push(item);
      }
      const dayTotal = items.reduce((s,i) => s + i.amount, 0);

      const cellHtml = (catItems) => {
        if (!catItems.length) return `<td class="td-empty" colspan="2">--</td>`;
        const names = catItems.map(it =>
          `<div class="item-line"><button class="btn-del" onclick="deleteItem('${date}','${it.id}')">✕</button><span>${it.name}</span></div>`
        ).join("");
        const prices = catItems.map(it =>
          `<div class="price-line">₹${fmt(it.amount)}</div>`
        ).join("");
        return `<td class="td-name"><div class="item-lines">${names}</div></td><td class="td-price"><div class="item-lines">${prices}</div></td>`;
      };

      html += `<tr>
        <td class="td-date">${date}</td>
        ${cellHtml(catMap["Transport"])}
        ${cellHtml(catMap["Snacks/Orders"])}
        ${cellHtml(catMap["Food"])}
        ${cellHtml(catMap["Specials"])}
        ${cellHtml(catMap["Others"])}
        <td class="td-total">₹${fmt(dayTotal)}</td>
        <td></td>
      </tr>`;
    }

    // Totals row
    const fmtTot = (n) => n > 0 ? `₹${fmt(n)}` : `--`;
    html += `<tr class="totals-row">
      <td class="tot-label">TOTAL</td>
      <td colspan="2">${fmtTot(catTotals["Transport"])}</td>
      <td colspan="2">${fmtTot(catTotals["Snacks/Orders"])}</td>
      <td colspan="2">${fmtTot(catTotals["Food"])}</td>
      <td colspan="2">${fmtTot(catTotals["Specials"])}</td>
      <td colspan="2">${fmtTot(catTotals["Others"])}</td>
      <td class="tot-grand">₹${fmt(monthTotal)}</td>
      <td></td>
    </tr>`;

    html += `</tbody></table></div></div>`;
  }

  container.innerHTML = html;

  // Populate PDF month selector
  const sel = document.getElementById("pdfMonthSelect");
  const prevVal = sel.value;
  sel.innerHTML = `<option value="all">All Months</option>`;
  for (const mk of sortedMonths) {
    const [y, m] = mk.split("-");
    sel.innerHTML += `<option value="${mk}">${monthNames[parseInt(m)]} ${y}</option>`;
  }
  if ([...sel.options].some(o => o.value === prevVal)) sel.value = prevVal;
}

async function exportPDF() {
  const data = await (await fetch("/api/data")).json();
  const expenses = data.expenses || {};
  const selectedMonth = document.getElementById("pdfMonthSelect").value;
  const { jsPDF } = window.jspdf;
  const monthNames = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

  const byMonth = {};
  for (const [date, items] of Object.entries(expenses)) {
    const [d, m, y] = date.split("/");
    const mk = `${y}-${m}`;
    if (!byMonth[mk]) byMonth[mk] = {};
    byMonth[mk][date] = items;
  }

  let monthsToExport = Object.keys(byMonth).sort();
  if (selectedMonth !== "all") monthsToExport = monthsToExport.filter(k => k === selectedMonth);
  if (monthsToExport.length === 0) { showToast("No data to export", "#ef4444"); return; }

  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  let isFirstPage = true;

  for (const mk of monthsToExport) {
    const [y, m] = mk.split("-");
    const mName = `${monthNames[parseInt(m)]} ${y}`;
    const daysData = byMonth[mk];

    const sortedDates = Object.keys(daysData).sort((a,b) => {
      const [da,ma,ya] = a.split("/"); const [db,mb,yb] = b.split("/");
      return new Date(`${ya}-${ma}-${da}`) - new Date(`${yb}-${mb}-${db}`);
    });

    let monthTotal = 0;
    const catTotals = { "Transport":0, "Snacks/Orders":0, "Food":0, "Specials":0, "Others":0 };
    for (const date of sortedDates)
      for (const item of daysData[date]) {
        monthTotal += item.amount;
        const cat = CATEGORIES.includes(item.category) ? item.category : "Others";
        catTotals[cat] += item.amount;
      }

    if (!isFirstPage) doc.addPage();
    isFirstPage = false;

    doc.setFontSize(15); doc.setFont("helvetica", "bold"); doc.setTextColor(0,0,0);
    doc.text(`Expense Tracker - ${mName}`, 14, 13);
    doc.setFontSize(11); doc.setFont("helvetica", "normal");
    doc.text(`Total: Rs. ${monthTotal.toFixed(2)}`, 283, 13, { align: "right" });
    doc.setDrawColor(180,180,180);
    doc.line(14, 16, 283, 16);

    const tableRows = [];
    for (const date of sortedDates) {
      const items = daysData[date];
      const catMap = { "Transport":[], "Snacks/Orders":[], "Food":[], "Specials":[], "Others":[] };
      for (const item of items) {
        const cat = CATEGORIES.includes(item.category) ? item.category : "Others";
        catMap[cat].push(item);
      }
      const dayTotal = items.reduce((s,i) => s + i.amount, 0);
      const cellText = (arr) => arr.length ? arr.map(i => `${i.name}  Rs.${i.amount}`).join("\n") : "--";
      tableRows.push([date, cellText(catMap["Transport"]), cellText(catMap["Snacks/Orders"]), cellText(catMap["Food"]), cellText(catMap["Specials"]), cellText(catMap["Others"]), `Rs. ${dayTotal.toFixed(2)}`]);
    }

    const fmtPDF = (n) => n > 0 ? `Rs. ${n.toFixed(2)}` : "--";
    tableRows.push(["TOTAL", fmtPDF(catTotals["Transport"]), fmtPDF(catTotals["Snacks/Orders"]), fmtPDF(catTotals["Food"]), fmtPDF(catTotals["Specials"]), fmtPDF(catTotals["Others"]), `Rs. ${monthTotal.toFixed(2)}`]);

    doc.autoTable({
      startY: 20,
      head: [["Date", "Transport", "Snacks/Orders", "Food", "Specials", "Others", "Total"]],
      body: tableRows,
      styles: { font: "helvetica", fontSize: 9, cellPadding: 3, textColor: [30,30,30], fillColor: [255,255,255], lineColor: [200,200,200], lineWidth: 0.3, overflow: "linebreak", valign: "top" },
      headStyles: { fillColor: [40,40,40], textColor: [255,255,255], fontStyle: "bold", fontSize: 9 },
      alternateRowStyles: { fillColor: [245,245,245] },
      didParseCell: (d) => {
        if (d.row.index === tableRows.length - 1) {
          d.cell.styles.fillColor = [215,215,215];
          d.cell.styles.fontStyle = "bold";
        }
      },
      columnStyles: {
        0: { cellWidth: 22, fontStyle: "bold" },
        1: { cellWidth: 40 },
        2: { cellWidth: 44 },
        3: { cellWidth: 40 },
        4: { cellWidth: 40 },
        5: { cellWidth: 40 },
        6: { cellWidth: 30, fontStyle: "bold", halign: "right" }
      },
      margin: { left: 14, right: 14 },
    });

    const pageH = doc.internal.pageSize.height;
    doc.setFontSize(8); doc.setTextColor(130,130,130);
    doc.text(`Generated on ${new Date().toLocaleDateString("en-IN")}`, 14, pageH - 5);
  }

  doc.save(selectedMonth === "all" ? "expenses_all.pdf" : `expenses_${monthsToExport[0]}.pdf`);
  showToast("PDF downloaded!");
}

function showToast(msg, color="#22c55e") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = color;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) this.classList.remove("active");
});

renderAll();
</script>
</body>
</html>
